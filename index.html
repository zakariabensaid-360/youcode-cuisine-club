<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>youcode-cuisine-club</title>
  </head>
  <body class="flex flex-col gap-8">
    <header class="flex justify-between p-4 px-7">
      <h1 class="font-bold text-4xl">Youcode Cuisine Club
        <span id="counter" class="px-1.5 py-0.5 text-xs  bg-gray-900 text-white rounded-2xl font-medium">0</span>
      </h1>
      <button
      id="add-display"
        class="px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-lg cursor-pointer"
      >
        Add recipe
      </button>
    </header>
    <main class=" flex flex-col justify-center items-center gap-8">
      <form id="search-form" class="flex items-center gap-2 w-full max-w-md">
        <input
          type="search"
          name="search"
          placeholder="Search for recipe..."
          class="flex-1 px-3.5 py-2 text-sm text-gray-900 bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-gray-400"
        />
        <button
          id="search-btn"
          class="px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-lg cursor-pointer"
        >
          Search
        </button>
                <button
          id="reset-btn"
          class="px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-lg cursor-pointer"
        >
          Reset
        </button>
      </form>
      <section
  id="error"

  class="hidden my-6 rounded-xl border border-red-200 bg-red-50 p-4 text-red-900"
>
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div class="flex items-start gap-3">
      <svg
        class="h-5 w-5 text-red-600 shrink-0 mt-0.5"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm-.75-11.25a.75.75 0 011.5 0v4.5a.75.75 0 01-1.5 0v-4.5zm0 6.5a.75.75 0 011.5 0v.5a.75.75 0 01-1.5 0v-.5z"
          clip-rule="evenodd"
        />
      </svg>
      <div>
        <h2 id="error-title" class="text-sm font-semibold text-red-900">
          error title
        </h2>
        <p id="error-message" class="mt-1 text-sm text-red-700">
error message
        </p>
      </div>
    </div>

    <button
      id="retry-btn"
      type="button"
      class="px-3.5 py-2 text-xs font-medium text-red-700 bg-white hover:bg-red-100 border border-red-200 rounded-lg cursor-pointer shrink-0 self-start sm:self-center"
    >
      retry
    </button>
  </div>
</section>

<div id="add-modal" class="max-w-lg mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hidden">
  <h2 class="text-xl font-bold text-slate-800 mb-5">Propose a Recipe</h2>

  <div id="success-message" class="hidden mb-4 p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm">
    Recipe added successfully!
  </div>

  <form id="recipe-form"  class="space-y-4" novalidate>
    <div>
      <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Recipe Name</label>
      <input
        type="text"
        id="name"
        name="name"
        minlength="3"
        maxlength="60"
        required
        placeholder="e.g., Moroccan Chicken Tagine"
        class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-gray-500"
      />
      <p id="name-error" class="hidden mt-1 text-xs text-red-600">Name must be between 3 and 60 characters.</p>
    </div>

    <div >
      <label for="cooking" class="block text-sm font-medium text-slate-700 mb-1">Cooking Method</label>
      <select
        id="cooking"
        name="cooking"
        required
        class="w-full px-3.5 py-2 rounded-lg border border-slate-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
      >
        <option value="" disabled selected>Select cooking method</option>
        <option value="baking">Baking</option>
        <option value="boiling">Boiling</option>
        <option value="frying">Frying</option>
        <option value="grilling">Grilling</option>
        <option value="steaming">Steaming</option>
        <option value="no-cook">No-Cook</option>
      </select>
      <p id="cooking-error" class="hidden mt-1 text-xs text-red-600">Please select a cooking method.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="difficulty" class="block text-sm font-medium text-slate-700 mb-1">Difficulty</label>
        <select
          id="difficulty"
          name="difficulty"
          required
          class="w-full px-3.5 py-2 rounded-lg border border-slate-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
        >
          <option value="" disabled selected>Select difficulty</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <p id="difficulty-error" class="hidden mt-1 text-xs text-red-600">Please select a difficulty level.</p>
      </div>

      <div>
        <label for="time" class="block text-sm font-medium text-slate-700 mb-1">Time (minutes)</label>
        <input
          type="number"
          id="time"
          name="time"
          min="1"
          max="300"
          required
          placeholder="e.g., 45"
          class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
        />
        <p id="time-error" class="hidden mt-1 text-xs text-red-600">Time must be between 1 and 300 minutes.</p>
      </div>
    </div>

    <button
      type="submit"
      id="submit-btn"
      class="w-full py-2.5 px-4 bg-gray-900 hover:bg-gray-800 disabled:bg-slate-400 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-lg transition"
    >
      Submit Recipe
    </button>
  </form>
</div>
      <section
        id="cardbox"
        class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 px-7"
      ></section>
    </main>
    <footer></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
